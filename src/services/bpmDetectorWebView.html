<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BPM Detector</title>
</head>
<body>
  <script>
    /**
     * Professional BPM Detection using Web Audio API
     * Uses autocorrelation for accurate tempo detection
     */

    let audioContext = null;

    // Initialize Audio Context (lazy)
    function getAudioContext() {
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
      }
      return audioContext;
    }

    /**
     * Main BPM detection function
     */
    async function detectBPM(audioUrl) {
      try {
        console.log('[BPM Detector] Starting detection for:', audioUrl.substring(0, 50) + '...');

        const ctx = getAudioContext();

        // Fetch and decode audio
        console.log('[BPM Detector] Fetching audio...');
        const response = await fetch(audioUrl);
        const arrayBuffer = await response.arrayBuffer();

        console.log('[BPM Detector] Decoding audio...');
        const audioBuffer = await ctx.decodeAudioData(arrayBuffer);

        console.log('[BPM Detector] Audio decoded:', {
          duration: audioBuffer.duration.toFixed(2) + 's',
          sampleRate: audioBuffer.sampleRate + 'Hz',
          channels: audioBuffer.numberOfChannels
        });

        // Get mono channel data
        const samples = audioBuffer.getChannelData(0);
        const sampleRate = audioBuffer.sampleRate;

        // Detect BPM using autocorrelation
        console.log('[BPM Detector] Running BPM analysis...');
        const bpm = detectBPMFromSamples(samples, sampleRate);

        console.log('[BPM Detector] BPM detected:', bpm);
        return bpm;

      } catch (error) {
        console.error('[BPM Detector] Error:', error);
        throw error;
      }
    }

    /**
     * Detect BPM from PCM samples using autocorrelation
     */
    function detectBPMFromSamples(samples, sampleRate) {
      // Calculate onset envelope (energy changes over time)
      const hopSize = 512;
      const onsetEnvelope = calculateOnsetEnvelope(samples, hopSize);

      // Apply autocorrelation to find periodicity
      const minBPM = 60;
      const maxBPM = 200;
      const minLag = Math.floor((60 / maxBPM) * (sampleRate / hopSize));
      const maxLag = Math.floor((60 / minBPM) * (sampleRate / hopSize));

      const autocorr = autocorrelate(onsetEnvelope, minLag, maxLag);

      // Find peaks in autocorrelation
      const peaks = findPeaks(autocorr, minLag);

      if (peaks.length === 0) {
        console.warn('[BPM Detector] No peaks found, using default');
        return 120;
      }

      // Convert best peak to BPM
      const bestPeakLag = peaks[0].index + minLag;
      let bpm = (60 * (sampleRate / hopSize)) / bestPeakLag;

      // Adjust for common BPM ranges (handle double/half time)
      bpm = adjustBPMRange(bpm);

      return Math.round(bpm);
    }

    /**
     * Calculate onset envelope (first-order difference of energy)
     */
    function calculateOnsetEnvelope(audioData, hopSize) {
      const numFrames = Math.floor(audioData.length / hopSize);
      const envelope = new Float32Array(numFrames);

      let prevEnergy = 0;
      for (let i = 0; i < numFrames; i++) {
        const start = i * hopSize;
        const end = Math.min(start + hopSize, audioData.length);

        // Calculate RMS energy for this frame
        let energy = 0;
        for (let j = start; j < end; j++) {
          energy += audioData[j] * audioData[j];
        }
        energy = Math.sqrt(energy / (end - start));

        // Onset = positive energy change
        envelope[i] = Math.max(0, energy - prevEnergy);
        prevEnergy = energy;
      }

      return envelope;
    }

    /**
     * Autocorrelation function
     */
    function autocorrelate(data, minLag, maxLag) {
      const lagRange = maxLag - minLag;
      const result = new Float32Array(lagRange);

      for (let lag = 0; lag < lagRange; lag++) {
        const actualLag = lag + minLag;
        let sum = 0;
        let count = 0;

        for (let i = 0; i < data.length - actualLag; i++) {
          sum += data[i] * data[i + actualLag];
          count++;
        }

        result[lag] = sum / count;
      }

      // Normalize
      const max = Math.max(...result);
      if (max > 0) {
        for (let i = 0; i < result.length; i++) {
          result[i] /= max;
        }
      }

      return result;
    }

    /**
     * Find peaks in a signal
     */
    function findPeaks(data, minDistance) {
      const peaks = [];

      for (let i = 1; i < data.length - 1; i++) {
        if (data[i] > data[i - 1] && data[i] > data[i + 1]) {
          // Check if far enough from previous peak
          if (peaks.length === 0 || i - peaks[peaks.length - 1].index >= minDistance) {
            peaks.push({ index: i, value: data[i] });
          } else if (data[i] > peaks[peaks.length - 1].value) {
            // Replace previous peak if this one is higher
            peaks[peaks.length - 1] = { index: i, value: data[i] };
          }
        }
      }

      // Sort by value (highest first)
      peaks.sort((a, b) => b.value - a.value);

      return peaks;
    }

    /**
     * Adjust BPM to common range (handle double/half time)
     */
    function adjustBPMRange(bpm) {
      // Most music is between 60-200 BPM
      while (bpm < 60) {
        bpm *= 2;
      }
      while (bpm > 200) {
        bpm /= 2;
      }

      return bpm;
    }

    /**
     * Message handler from React Native
     */
    window.addEventListener('message', async (event) => {
      try {
        const message = JSON.parse(event.data);

        if (message.action === 'detectBPM') {
          const bpm = await detectBPM(message.audioUrl);

          // Send result back to React Native
          window.ReactNativeWebView.postMessage(JSON.stringify({
            success: true,
            bpm: bpm
          }));
        }
      } catch (error) {
        // Send error back to React Native
        window.ReactNativeWebView.postMessage(JSON.stringify({
          success: false,
          error: error.message
        }));
      }
    });

    // Signal ready
    console.log('[BPM Detector] WebView ready');
    window.ReactNativeWebView.postMessage(JSON.stringify({ ready: true }));
  </script>
</body>
</html>
